<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>数学课堂体验问卷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Poppins', 'Inter', system-ui, sans-serif;
            background: linear-gradient(145deg, #e9f5ff 0%, #d9e9fa 100%);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .survey-container {
            max-width: 950px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1f4e6e, #2c3e66);
            padding: 2rem 1.8rem;
            text-align: center;
            color: white;
            border-bottom: 5px solid #ffb347;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .subhead {
            font-size: 0.95rem;
            opacity: 0.9;
            margin-top: 0.5rem;
        }

        .progress-area {
            background: #f0f4f9;
            padding: 0.7rem 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        .progress-text {
            font-weight: 600;
            background: #e9edf2;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
        }

        .progress-bar-bg {
            flex: 1;
            height: 7px;
            background: #cddae9;
            border-radius: 20px;
            max-width: 260px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #ffb347;
            border-radius: 20px;
        }

        form {
            padding: 1.8rem;
        }

        .question-card {
            background: #ffffff;
            border-radius: 1.5rem;
            margin-bottom: 1.6rem;
            padding: 1.2rem 1.5rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            border: 1px solid #eef2f8;
        }

        .q-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #1f4e6e;
            margin-bottom: 1rem;
            border-left: 5px solid #ffb347;
            padding-left: 12px;
        }

        .required-star {
            color: #e56e2c;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .radio-option, .checkbox-option {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        input[type="radio"], input[type="checkbox"] {
            accent-color: #ffb347;
            width: 17px;
            height: 17px;
        }

        .rating-numbers {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .rating-number {
            background: #f1f5f9;
            border-radius: 60px;
            padding: 0.4rem 1rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            font-size: 0.9rem;
            transition: all 0.1s;
        }

        .rating-number.selected {
            background: #ffb347;
            color: white;
            border-color: #ff9f1c;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border-radius: 28px;
            border: 1.5px solid #dce5ef;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .action-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 1rem;
            gap: 1rem;
        }

        button {
            background: white;
            border: 2px solid #cfdfed;
            padding: 10px 28px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        button.primary-btn {
            background: #ffb347;
            border-color: #ffb347;
            color: white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        button.primary-btn:hover {
            background: #f5a623;
            transform: translateY(-2px);
        }

        footer {
            background: #eef3fa;
            text-align: center;
            padding: 1rem;
            font-size: 0.7rem;
            color: #5d7184;
        }

        /* 完成弹窗风格 (提交后独立完成页) */
        .completion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .completion-card {
            background: white;
            border-radius: 2rem;
            max-width: 500px;
            width: 90%;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 25px 40px rgba(0,0,0,0.2);
        }
        .completion-card h2 { color: #1f4e6e; margin: 0.8rem 0; }
        .completion-card p { color: #2c5a7a; margin-bottom: 1.5rem; }
        .btn-return {
            background: #ffb347;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 0.5rem;
        }
        .admin-hint {
            margin-top: 1rem;
            font-size: 0.75rem;
        }
        .admin-hint a {
            color: #ffb347;
            text-decoration: underline;
        }
        .error-msg {
            color: #c23d2b;
            margin-top: 0.5rem;
            font-size: 0.8rem;
        }
        @media (max-width: 640px) {
            .survey-container { margin: 0; }
            form { padding: 1rem; }
        }
    </style>
</head>
<body>
<div class="survey-container">
    <div class="header">
        <h1>📐 数学课堂体验调查 ✖️➗</h1>
        <div class="subhead">你的真实反馈，让数学课堂更精彩</div>
    </div>
    <div class="progress-area">
        <div class="progress-text" id="progressText">0 / 6 已完成</div>
        <div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <form id="mathSurveyForm">
        <!-- Q1 满意度 -->
        <div class="question-card">
            <div class="q-title">1. 你对数学课堂的整体满意度？<span class="required-star">*</span></div>
            <div class="rating-numbers" id="q1_group">
                <label class="rating-number"><input type="radio" name="q1_satisfaction" value="1"> 1</label>
                <label class="rating-number"><input type="radio" name="q1_satisfaction" value="2"> 2</label>
                <label class="rating-number"><input type="radio" name="q1_satisfaction" value="3"> 3</label>
                <label class="rating-number"><input type="radio" name="q1_satisfaction" value="4"> 4</label>
                <label class="rating-number"><input type="radio" name="q1_satisfaction" value="5"> 5</label>
            </div>
            <div style="font-size:0.7rem; color:#6b8dae;">1-不满意 → 5-非常满意</div>
        </div>
        <!-- Q2 互动频率 -->
        <div class="question-card">
            <div class="q-title">2. 数学课堂的互动频率？<span class="required-star">*</span></div>
            <div class="options-group">
                <label class="radio-option"><input type="radio" name="q2_interaction" value="非常频繁"> 非常频繁</label>
                <label class="radio-option"><input type="radio" name="q2_interaction" value="比较多"> 比较多</label>
                <label class="radio-option"><input type="radio" name="q2_interaction" value="一般"> 一般</label>
                <label class="radio-option"><input type="radio" name="q2_interaction" value="很少"> 很少</label>
            </div>
        </div>
        <!-- Q3 难度 -->
        <div class="question-card">
            <div class="q-title">3. 课堂内容难度感受？<span class="required-star">*</span></div>
            <div class="options-group">
                <label class="radio-option"><input type="radio" name="q3_difficulty" value="太简单"> 太简单</label>
                <label class="radio-option"><input type="radio" name="q3_difficulty" value="适中"> 适中</label>
                <label class="radio-option"><input type="radio" name="q3_difficulty" value="偏难"> 偏难</label>
                <label class="radio-option"><input type="radio" name="q3_difficulty" value="非常难"> 非常难</label>
            </div>
        </div>
        <!-- Q4 多选 -->
        <div class="question-card">
            <div class="q-title">4. 你喜欢的教学方式？（多选）<span class="required-star">*</span></div>
            <div class="options-group">
                <label class="checkbox-option"><input type="checkbox" name="q4_methods" value="小组合作探究"> 小组合作探究</label>
                <label class="checkbox-option"><input type="checkbox" name="q4_methods" value="多媒体/动画演示"> 多媒体/动画演示</label>
                <label class="checkbox-option"><input type="checkbox" name="q4_methods" value="趣味数学游戏"> 趣味数学游戏</label>
                <label class="checkbox-option"><input type="checkbox" name="q4_methods" value="传统板书讲解"> 传统板书讲解</label>
                <label class="checkbox-option"><input type="checkbox" name="q4_methods" value="实际应用案例"> 实际应用案例</label>
            </div>
        </div>
        <!-- Q5 氛围 -->
        <div class="question-card">
            <div class="q-title">5. 课堂氛围评价 (1压抑→5轻松愉悦)<span class="required-star">*</span></div>
            <div class="rating-numbers" id="q5_group">
                <label class="rating-number"><input type="radio" name="q5_atmosphere" value="1"> 1</label>
                <label class="rating-number"><input type="radio" name="q5_atmosphere" value="2"> 2</label>
                <label class="rating-number"><input type="radio" name="q5_atmosphere" value="3"> 3</label>
                <label class="rating-number"><input type="radio" name="q5_atmosphere" value="4"> 4</label>
                <label class="rating-number"><input type="radio" name="q5_atmosphere" value="5"> 5</label>
            </div>
        </div>
        <!-- Q6 兴趣 -->
        <div class="question-card">
            <div class="q-title">6. 数学兴趣提升情况？<span class="required-star">*</span></div>
            <div class="options-group">
                <label class="radio-option"><input type="radio" name="q6_interest" value="明显提升"> 明显提升</label>
                <label class="radio-option"><input type="radio" name="q6_interest" value="稍有提升"> 稍有提升</label>
                <label class="radio-option"><input type="radio" name="q6_interest" value="没变化"> 没变化</label>
                <label class="radio-option"><input type="radio" name="q6_interest" value="有所下降"> 有所下降</label>
            </div>
        </div>
        <!-- Q7 建议 -->
        <div class="question-card">
            <div class="q-title">7. 你的改进建议 (选填)</div>
            <textarea name="suggestions" rows="2" placeholder="让数学课堂更棒的点子..."></textarea>
        </div>
        <div class="action-buttons">
            <button type="button" id="resetBtn">🔄 重置问卷</button>
            <button type="button" id="submitBtn" class="primary-btn">📊 提交问卷</button>
        </div>
        <div id="formErrorMsg" class="error-msg" style="text-align:center;"></div>
    </form>
</div>

<script>
    // ---------- 问卷逻辑 + 存储至 localStorage (与 admin.html 共享) ----------
    let surveyResponses = [];

    // 加载现有数据
    function loadData() {
        const stored = localStorage.getItem("math_survey_backend");
        if(stored) {
            try { surveyResponses = JSON.parse(stored); } catch(e) { surveyResponses = []; }
        } else {
            surveyResponses = [];
        }
    }

    function saveData() {
        localStorage.setItem("math_survey_backend", JSON.stringify(surveyResponses));
    }

    // 获取当前表单数据
    function getCurrentFormData() {
        const q1 = document.querySelector('input[name="q1_satisfaction"]:checked') ? parseInt(document.querySelector('input[name="q1_satisfaction"]:checked').value) : null;
        const q2 = document.querySelector('input[name="q2_interaction"]:checked') ? document.querySelector('input[name="q2_interaction"]:checked').value : null;
        const q3 = document.querySelector('input[name="q3_difficulty"]:checked') ? document.querySelector('input[name="q3_difficulty"]:checked').value : null;
        const q4 = Array.from(document.querySelectorAll('input[name="q4_methods"]:checked')).map(cb => cb.value);
        const q5 = document.querySelector('input[name="q5_atmosphere"]:checked') ? parseInt(document.querySelector('input[name="q5_atmosphere"]:checked').value) : null;
        const q6 = document.querySelector('input[name="q6_interest"]:checked') ? document.querySelector('input[name="q6_interest"]:checked').value : null;
        const suggestion = document.querySelector('textarea[name="suggestions"]').value.trim();
        return { q1, q2, q3, q4, q5, q6, suggestion };
    }

    function validateFormData(data) {
        let err = [];
        if(data.q1 === null) err.push("请选择整体满意度");
        if(!data.q2) err.push("请选择互动频率");
        if(!data.q3) err.push("请选择难度感受");
        if(data.q4.length === 0) err.push("请至少选择一种喜欢的教学方式");
        if(data.q5 === null) err.push("请评价课堂氛围评分");
        if(!data.q6) err.push("请选择兴趣提升情况");
        return err;
    }

    // 重置表单 & 进度
    function resetSurveyForm() {
        document.getElementById('mathSurveyForm').reset();
        document.querySelectorAll('.rating-number').forEach(el => el.classList.remove('selected'));
        document.getElementById('formErrorMsg').innerText = '';
        updateProgressBar();
    }

    // 进度条逻辑
    function computeCompleted() {
        let c = 0;
        if(document.querySelector('input[name="q1_satisfaction"]:checked')) c++;
        if(document.querySelector('input[name="q2_interaction"]:checked')) c++;
        if(document.querySelector('input[name="q3_difficulty"]:checked')) c++;
        if(document.querySelectorAll('input[name="q4_methods"]:checked').length > 0) c++;
        if(document.querySelector('input[name="q5_atmosphere"]:checked')) c++;
        if(document.querySelector('input[name="q6_interest"]:checked')) c++;
        return c;
    }
    function updateProgressBar() {
        const comp = computeCompleted();
        const totalReq = 6;
        const percent = (comp/totalReq)*100;
        document.getElementById('progressFill').style.width = percent+'%';
        document.getElementById('progressText').innerText = `${comp}/${totalReq} 已完成`;
    }

    // 显示完成浮层 (独立完成页效果)
    function showCompletionModal() {
        // 遮罩
        const overlay = document.createElement('div');
        overlay.className = 'completion-overlay';
        overlay.innerHTML = `
            <div class="completion-card">
                <div style="font-size: 3rem;">🎉📐</div>
                <h2>问卷提交成功！</h2>
                <p>感谢参与数学课堂体验调查，你的反馈已存入统计系统。</p>
                <div>
                    <button id="closeCompletionBtn" class="btn-return">📝 再填一份</button>
                </div>
                <div class="admin-hint">
                </div>
            </div>
        `;
        document.body.appendChild(overlay);
        const closeBtn = overlay.querySelector('#closeCompletionBtn');
        closeBtn.addEventListener('click', () => {
            overlay.remove();
            // 重置问卷表单，回到填写状态
            resetSurveyForm();
        });
    }

    // 提交主逻辑
    function submitSurvey() {
        const data = getCurrentFormData();
        const errors = validateFormData(data);
        if(errors.length > 0) {
            document.getElementById('formErrorMsg').innerText = "❌ " + errors.join("；");
            return;
        }
        // 存储新答卷
        const record = {
            q1: data.q1, q2: data.q2, q3: data.q3, q4: data.q4,
            q5: data.q5, q6: data.q6, suggestion: data.suggestion || "",
            timestamp: Date.now()
        };
        loadData();            // 拉取最新
        surveyResponses.push(record);
        saveData();
        // 重置表单，清空当前填写内容 (自动重置)
        resetSurveyForm();
        // 显示独立完成浮层 (相当于单独一页完成页面)
        showCompletionModal();
    }

    // 样式绑定评分高亮
    function bindRatingStyles() {
        document.querySelectorAll('.rating-numbers').forEach(group => {
            const radios = group.querySelectorAll('input[type="radio"]');
            radios.forEach(radio => {
                radio.addEventListener('change', function() {
                    group.querySelectorAll('.rating-number').forEach(lbl => lbl.classList.remove('selected'));
                    if(this.checked) {
                        const parent = this.closest('.rating-number');
                        if(parent) parent.classList.add('selected');
                    }
                });
                if(radio.checked) {
                    const parent = radio.closest('.rating-number');
                    if(parent) parent.classList.add('selected');
                }
            });
        });
    }

    function init() {
        loadData();
        bindRatingStyles();
        updateProgressBar();
        document.getElementById('submitBtn').addEventListener('click', submitSurvey);
        document.getElementById('resetBtn').addEventListener('click', resetSurveyForm);
        const inputs = document.querySelectorAll('#mathSurveyForm input, #mathSurveyForm textarea');
        inputs.forEach(inp => inp.addEventListener('change', updateProgressBar));
    }
    init();
</script>
</body>
</html>
